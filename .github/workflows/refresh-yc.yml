name: Refresh verified YC profiles
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-yc
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node backend/ycscrapping/refresh-verified.cjs
      - run: npx tsc --noEmit -p frontend/tsconfig.json
      - name: Publish validated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/data/startups.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh YC source profiles'
          git push
